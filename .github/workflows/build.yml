name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Unit tests
        working-directory: tak-gateway/src
        run: go vet ./... && go test ./...

  hak5:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build Pager / Mark VII / Tetra bundles
        run: hak5/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hak5-bundles
          path: dist/*.tar.gz

  openwrt:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OpenWrt One = mediatek/filogic = aarch64_cortex-a53. Add more archs here.
        arch:
          - aarch64_cortex-a53-openwrt-25.12
    steps:
      - uses: actions/checkout@v4
      - name: Build apk packages with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: tak
          PACKAGES: tak-gateway luci-app-tak-gateway
          NO_SHFMT_CHECK: 1
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.arch }}
          path: bin/packages/*/tak/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ hak5, openwrt ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
